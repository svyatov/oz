version: 2

builds:
  - main: ./cmd/oz/
    binary: oz
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

# One SPDX document per archive, generated by syft (the goreleaser default),
# so a user can answer which dependency versions are inside a binary.
sboms:
  - artifacts: archive

# Release notes come from the matching CHANGELOG.md section, passed with
# --release-notes in .github/workflows/release.yml. That flag already skips
# goreleaser's own changelog generation, and there is deliberately no
# `changelog: disable: true` here: disabling the changelog skips the step that
# reads the file too, which ships a release with an empty body.

homebrew_casks:
  - name: oz
    description: "Config-driven CLI wizard framework"
    homepage: "https://github.com/svyatov/oz"
    binaries:
      - oz
    generate_completions_from_executable:
      shell_parameter_format: cobra
      shells:
        - bash
        - zsh
        - fish
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/oz"]
          end
    repository:
      owner: svyatov
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
